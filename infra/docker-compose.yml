services:
  gateway:
    build:
      context: ../services/gateway
    ports:
      - "8080:8000"
      - "8002:8001"
    depends_on:
      - ingestion
      - main-backend

  ingestion:
    build:
      context: ../services/ingestion
    command: .venv/bin/python manage.py run_ingestion_api_with_scheduler --host 0.0.0.0 --port 8001 --scheduler-at 02:00 --scheduler-timezone UTC --limit 20 --include-gdelt
    env_file:
      - ./env/ingestion.env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  ingestion-daily:
    build:
      context: ../services/ingestion
    command: .venv/bin/python manage.py daily_company_update --limit 20 --skip-gdelt
    env_file:
      - ./env/ingestion.env
    profiles:
      - jobs
    depends_on:
      - postgres
      - redis

  main-backend:
    build:
      context: ../services/main/backend
    command: python manage.py runserver 0.0.0.0:8100
    env_file:
      - ./env/main.env
    ports:
      - "8100:8100"
    depends_on:
      - postgres

  main-frontend:
    build:
      context: ../services/main/frontend
    ports:
      - "4200:4200"
    profiles:
      - frontend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: business
      POSTGRES_USER: the_dj
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "16379:6379"

volumes:
  postgres_data:
