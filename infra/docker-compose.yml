services:
  gateway:
    build:
      context: ../services/gateway
    ports:
      - "8080:8000"
      - "8002:8001"
    depends_on:
      - ingestion
      - main-backend

  ingestion:
    build:
      context: ../services/ingestion
    command: .venv/bin/python manage.py run_ingestion_api_with_scheduler --host 0.0.0.0 --port 8001 --scheduler-timezone UTC --limit 20 --batch-size 10 --include-gdelt --include-market-data --include-financial-facts --include-insider-transactions --insider-form-limit 5 --include-official-product-prices --include-company-profiles --include-macro-context --include-quality-scoring --split-batches
    env_file:
      - ./env/ingestion.env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  ingestion-daily:
    build:
      context: ../services/ingestion
    command: .venv/bin/python manage.py daily_company_update --limit 20 --skip-gdelt --include-company-profiles
    env_file:
      - ./env/ingestion.env
    profiles:
      - jobs
    depends_on:
      - postgres
      - redis

  main-backend:
    build:
      context: ../services/main/backend
    command: python manage.py runserver 0.0.0.0:8100
    env_file:
      - ./env/main.env
    ports:
      - "8100:8100"
    volumes:
      - main_media:/app/media
    depends_on:
      - postgres

  main-frontend:
    build:
      context: ../services/main/frontend
    ports:
      - "4200:4200"
    profiles:
      - frontend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: business
      POSTGRES_USER: the_dj
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "16379:6379"

  logging-loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  logging-promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - logging-loki

  logging-grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - logging-loki

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  main_media:
